# HopperRails 設定ファイル
# バージョン: 0.0.1

# デバッグモード（詳細なログを出力）
デバッグモード: false

# レッドストーン信号の持続時間（ティック）
レッドストーン信号持続時間: 20

# アイテム吸収チェック間隔（ティック）
チェック間隔: 10

# メッセージ設定
メッセージ:
  プラグイン有効化: '&a[HopperRails] プラグインが有効化されました'
  プラグイン無効化: '&c[HopperRails] プラグインが無効化されました'
  吸収モード開始: '&eホッパー付きトロッコが吸収モードに移行しました'
  移動モード開始: '&aホッパー付きトロッコが移動モードに移行しました'
  待機モード開始: '&7ホッパー付きトロッコが待機モードに移行しました'
